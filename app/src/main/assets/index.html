<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>English ↔ Indonesian Dictionary</title>
<style>
:root {
  color-scheme: light;
  font-family: system-ui, sans-serif;
  background: #f5f7fb;
  color: #182235;
}
* { box-sizing: border-box; }
body { margin: 0; }
main { width: min(100% - 32px, 680px); margin: auto; padding: 28px 0 40px; }
h1 { font-size: 1.8rem; line-height: 1.2; }
.subtitle, .muted { color: #596579; line-height: 1.6; }
.status { display: inline-block; border-radius: 999px; background: #e5f6ec; color: #17653b; padding: 6px 10px; font-size: .85rem; }
.panel { background: white; border: 1px solid #e0e6ef; border-radius: 18px; padding: 20px; margin-top: 20px; }
label { display: block; font-weight: 650; margin: 16px 0 8px; }
input, select { width: 100%; padding: 13px; border: 1px solid #cbd4e2; border-radius: 11px; font: inherit; background: white; color: inherit; }
button { padding: 13px; border: 0; border-radius: 11px; background: #2457d6; color: white; font: inherit; font-weight: 650; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #8cb0ff; outline-offset: 2px; }
.primary { width: 100%; margin-top: 14px; }
.switch { width: 100%; margin-top: 10px; background: #e9efff; color: #2049ad; }
.result { border-top: 1px solid #e0e6ef; margin-top: 20px; padding-top: 16px; }
.entry { padding: 13px 0; border-bottom: 1px solid #edf0f5; }
.entry:last-child { border-bottom: 0; }
.word { font-size: 1.2rem; font-weight: 750; overflow-wrap: anywhere; }
.translation { font-size: 1.05rem; margin-top: 5px; }
.pos { color: #596579; font-size: .85rem; margin-top: 5px; }
footer { margin-top: 22px; color: #687386; font-size: .85rem; }
</style>
</head>
<body>
<main>
  <span class="status">Offline · Local vocabulary</span>
  <h1>English ↔ Indonesian Dictionary</h1>
  <p class="subtitle">Look up words in either language. Search works on your device without an internet connection.</p>

  <section class="panel">
    <h2>Find a word</h2>
    <label for="direction">Lookup direction</label>
    <select id="direction">
      <option value="en-id">English → Indonesian</option>
      <option value="id-en">Indonesian → English</option>
    </select>

    <label for="query">Word or phrase</label>
    <input id="query" type="search" placeholder="Try: hello, water, makan..." autocomplete="off" enterkeyhint="search">
    <button class="primary" id="searchButton" type="button">Search dictionary</button>
    <button class="switch" id="swapButton" type="button">Switch direction</button>

    <div class="result" id="results" role="status" aria-live="polite">
      <p class="muted">Try a word such as “hello” or “makan”.</p>
    </div>
  </section>

  <footer id="footer">Starter vocabulary · Stored in this app · No internet required</footer>
</main>

<script>
"use strict";

const direction = document.getElementById("direction");
const query = document.getElementById("query");
const results = document.getElementById("results");
const searchButton = document.getElementById("searchButton");
const swapButton = document.getElementById("swapButton");

function showMessage(message) {
  results.replaceChildren();
  const p = document.createElement("p");
  p.className = "muted";
  p.textContent = message;
  results.appendChild(p);
}

function safeDefinition(html) {
  const parsed = new DOMParser().parseFromString(html, "text/html");
  const allowed = new Set([
    "DIV", "SPAN", "I", "B", "BR", "P", "EM", "STRONG",
    "SUP", "SUB", "CODE", "UL", "OL", "LI", "SMALL"
  ]);

  function copySafe(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      return document.createTextNode(node.nodeValue || "");
    }
    if (node.nodeType !== Node.ELEMENT_NODE) {
      return document.createDocumentFragment();
    }

    const fragment = document.createDocumentFragment();
    for (const child of node.childNodes) {
      fragment.appendChild(copySafe(child));
    }
    if (!allowed.has(node.tagName)) return fragment;

    const clean = document.createElement(node.tagName.toLowerCase());
    clean.appendChild(fragment);
    return clean;
  }

  const output = document.createDocumentFragment();
  for (const child of parsed.body.childNodes) {
    output.appendChild(copySafe(child));
  }
  return output;
}

function renderSearch() {
  const term = query.value.trim();
  if (!term) {
    showMessage("Enter a word or phrase to search.");
    return;
  }

  if (typeof window.DictionaryDB === "undefined") {
    showMessage("The offline dictionary is not ready. Please reopen the app.");
    return;
  }

  try {
    const matches = JSON.parse(
      window.DictionaryDB.search(direction.value, term)
    );
    results.replaceChildren();

    if (!matches.length) {
      showMessage("No matching entries found. Try another spelling or switch direction.");
      return;
    }

    const summary = document.createElement("p");
    summary.className = "muted";
    summary.textContent =
      matches.length + (matches.length === 50 ? " results (maximum shown)" :
      matches.length === 1 ? " result" : " results");
    results.appendChild(summary);

    for (const entry of matches) {
      const card = document.createElement("article");
      card.className = "entry";

      const word = document.createElement("div");
      word.className = "word";
      word.textContent = entry.term;
      card.appendChild(word);

      if (entry.term !== entry.word || entry.alias) {
        const related = document.createElement("div");
        related.className = "pos";
        related.textContent = "Dictionary entry: " + entry.word;
        card.appendChild(related);
      }

      const definition = document.createElement("div");
      definition.className = "translation";
      definition.appendChild(safeDefinition(entry.definition || ""));
      card.appendChild(definition);
      results.appendChild(card);
    }
  } catch (error) {
    showMessage("Search failed. Please close and reopen the app.");
  }
}

searchButton.addEventListener("click", renderSearch);
query.addEventListener("keydown", event => {
  if (event.key === "Enter") renderSearch();
});
query.addEventListener("input", renderSearch);
direction.addEventListener("change", renderSearch);

swapButton.addEventListener("click", () => {
  direction.value = direction.value === "en-id" ? "id-en" : "en-id";
  renderSearch();
});

document.getElementById("footer").textContent =
  "Offline dictionary · Search stays on this device · 598,035 searchable terms";
</script>
</body>
</html>
