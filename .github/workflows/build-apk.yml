name: Build English Indonesian Dictionary APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare dictionary database asset
        run: |
          gzip -t app/src/main/assets/dictionary.db.gz
          gzip -dc app/src/main/assets/dictionary.db.gz > app/src/main/assets/dictionary.db
          python -c "from pathlib import Path; p=Path('app/src/main/assets/dictionary.db'); assert p.read_bytes()[:16] == b'SQLite format 3\\x00'; print('Dictionary database asset validated')"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-indonesian-dictionary-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
